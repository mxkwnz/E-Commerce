version: "3.9"

services:
  postgres-product:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  product-service:
    build: ./product-service
    depends_on:
      - postgres-product
      - redis
    ports:
      - "8082:8082"