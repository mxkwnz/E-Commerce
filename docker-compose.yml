version: "3.9"

services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"

  postgres-product:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    depends_on:
      - postgres-auth
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable
    ports:
      - "8081:8081"
      - "50053:50053"

  product-service:
    build: ./product-service
    depends_on:
      - postgres-product
      - redis
    ports:
      - "8082:8082"