services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-product:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d product_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d order_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [ "--http_port", "8222" ]

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payment_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "1025:1025"
      - "8025:8025"

  product-service:
    build: ./product-service
    depends_on:
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-product:5432/product_db?sslmode=disable
      REDIS_URL: redis://redis:6379

  order-service:
    build: ./order-service
    depends_on:
      postgres-order:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-order:5432/order_db?sslmode=disable
      NATS_URL: nats://nats:4222

  payment-service:
    build: ./payment-service
    depends_on:
      postgres-payment:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-payment:5432/payment_db?sslmode=disable
      NATS_URL: nats://nats:4222

  auth-service:
    build: ./auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
      nats:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "8081:8081"
      - "50053:50053"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      APP_URL: ${APP_URL:-http://localhost:8081}
