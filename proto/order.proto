syntax = "proto3";

package order;

option go_package = "order-service/proto";

import "google/protobuf/timestamp.proto";

service OrderService {
  rpc AddToCart(AddToCartRequest) returns (CartItemResponse);
  rpc GetCart(GetCartRequest) returns (CartResponse);
  rpc GetCartItem(GetCartItemRequest) returns (CartItemResponse);
  rpc UpdateCartItem(UpdateCartItemRequest) returns (CartItemResponse);
  rpc RemoveFromCart(RemoveFromCartRequest) returns (RemoveFromCartResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);

  rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ConfirmOrder(ConfirmOrderRequest) returns (OrderStatusResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderStatusResponse);

  rpc GetOrdersByStatus(GetOrdersByStatusRequest) returns (ListOrdersResponse);
  rpc GetOrderStatistics(GetOrderStatisticsRequest) returns (OrderStatisticsResponse);
  rpc SearchOrders(SearchOrdersRequest) returns (ListOrdersResponse);
}

message CartItem {
  string id = 1;
  string user_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double unit_price = 5;
  string currency = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AddToCartRequest {
  string user_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double unit_price = 4;
  string currency = 5;
}

message GetCartRequest {
  string user_id = 1;
}

message CartResponse {
  repeated CartItem items = 1;
  double total_amount = 2;
  string currency = 3;
  int32 total_items = 4;
}

message GetCartItemRequest {
  string id = 1;
}

message CartItemResponse {
  CartItem item = 1;
}

message UpdateCartItemRequest {
  string id = 1;
  int32 quantity = 2;
}

message RemoveFromCartRequest {
  string id = 1;
}

message RemoveFromCartResponse {
  bool success = 1;
  string message = 2;
}

message ClearCartRequest {
  string user_id = 1;
}

message ClearCartResponse {
  bool success = 1;
  int32 items_removed = 2;
}

message OrderItem {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double unit_price = 5;
  string currency = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Order {
  string id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  string currency = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CheckoutRequest {
  string user_id = 1;
}

message CheckoutResponse {
  string order_id = 1;
  double total_amount = 2;
  string currency = 3;
  string status = 4;
}

message GetOrderRequest {
  string id = 1;
}

message OrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ConfirmOrderRequest {
  string id = 1;
}

message CancelOrderRequest {
  string id = 1;
  string reason = 2;
}

message OrderStatusResponse {
  bool success = 1;
  string message = 2;
  string order_id = 3;
  string status = 4;
}

message GetOrdersByStatusRequest {
  string user_id = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message OrderStatisticsResponse {
  int32 total_orders = 1;
  int32 pending_orders = 2;
  int32 confirmed_orders = 3;
  int32 cancelled_orders = 4;
  double total_revenue = 5;
  string currency = 6;
}

message GetOrderStatisticsRequest {
  string user_id = 1;
}

message SearchOrdersRequest {
  string user_id = 1;
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
}